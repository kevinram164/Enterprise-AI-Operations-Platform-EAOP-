apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-portal
  namespace: phoenix-platform
  labels:
    app: admin-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-portal
  template:
    metadata:
      labels:
        app: admin-portal
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: admin-portal
          image: harbor.ocp1.npd.co/phoenix/admin-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://api.platform.ocp1.npd.co
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: admin-portal
  namespace: phoenix-platform
spec:
  selector:
    app: admin-portal
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: admin-portal
  namespace: phoenix-platform
spec:
  host: portal.ocp1.npd.co
  to:
    kind: Service
    name: admin-portal
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
