apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-api-config
  namespace: phoenix-platform
data:
  OCP_BASE_DOMAIN: ocp1.npd.co
  KAFKA_TOPIC_PREFIX: phoenix
  PLATFORM_API_CORS_ORIGINS: https://portal.ocp1.npd.co
  TEMPLATES_DIR: /opt/app/templates/golden-path
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-api-secret
  namespace: phoenix-platform
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://phoenix:changeme-phoenix-db@postgres.phoenix-platform.svc:5432/phoenix
  REDIS_URL: redis://redis.phoenix-platform.svc:6379/0
  KAFKA_BOOTSTRAP_SERVERS: redpanda.phoenix-platform.svc:9092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: phoenix-platform
  labels:
    app: platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform-api
  template:
    metadata:
      labels:
        app: platform-api
    spec:
      imagePullSecrets:
        - name: harbor-pull-secret
      containers:
        - name: platform-api
          image: harbor.ocp1.npd.co/phoenix/platform-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-api-config
            - secretRef:
                name: platform-api-secret
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  namespace: phoenix-platform
spec:
  selector:
    app: platform-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: platform-api
  namespace: phoenix-platform
spec:
  host: api.platform.ocp1.npd.co
  to:
    kind: Service
    name: platform-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
