name: Platform API CI

on:
  push:
    branches: [main, master]
    paths:
      - "services/platform-api/**"
      - ".github/workflows/platform-api.yml"
  pull_request:
    paths:
      - "services/platform-api/**"

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: phoenix
          POSTGRES_PASSWORD: phoenix
          POSTGRES_DB: phoenix
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phoenix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql+asyncpg://phoenix:phoenix@localhost:5432/phoenix
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: services/platform-api
        run: pip install -e ".[dev]"

      - name: Run migrations
        working-directory: services/platform-api
        run: alembic upgrade head

      - name: Run tests
        working-directory: services/platform-api
        run: pytest -v
